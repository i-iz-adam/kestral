[package]
name = "kestrel"
version = "1.0.1"
edition = "2021"
default-run = "kestrel"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-open", "fs-read-file", "fs-write-file", "fs-create-dir", "path-all", "shell-open", "window-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
